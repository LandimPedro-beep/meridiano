{% set profile_params = {'feed_profile': current_feed_profile} if current_feed_profile is defined and current_feed_profile else {} %}
<header class="main-header">
    <div class="header-content">
        <a href="{{ url_for('index', **profile_params) }}" class="logo">
            <span class="logo-v">V</span>értice
        </a>
        <nav class="main-nav">
            <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint in ['index', 'view_brief'] else '' }}">Edições</a>
            <a href="{{ url_for('list_articles', feed_profile='vetor') }}" class="{{ 'active' if current_feed_profile == 'vetor' else '' }}">Vetor</a>
            <a href="{{ url_for('list_articles', feed_profile='matriz') }}" class="{{ 'active' if current_feed_profile == 'matriz' else '' }}">Matriz</a>
            <a href="{{ url_for('list_articles', feed_profile='esfera') }}" class="{{ 'active' if current_feed_profile == 'esfera' else '' }}">Esfera</a>
            <a href="{{ url_for('list_articles') }}" class="{{ 'active' if request.endpoint == 'list_articles' and not current_feed_profile else '' }}">Tudo</a>
            <a href="{{ url_for('collections') }}" class="{{ 'active' if request.endpoint in ['collections', 'view_collection'] else '' }}">Arquivo</a>
            <div class="header-actions" style="margin-left: auto;">
                <a href="{{ url_for('add_manual_article') }}" class="btn btn-add-article" title="Add New Article">
                    <i class="fas fa-plus"></i> Add Article
                </a>
            </div>
        </nav>
    </div>
</header>
{% include '_flash_messages.html' %}
